# HTTPS server block для meetrec (bp/spacecode/prod-it.obed.pro)
# Подключается после: certbot certonly --webroot -w /var/www/certbot -d bp.obed.pro -d spacecode.obed.pro -d prod-it.obed.pro --cert-name meetrec-obed
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bp.obed.pro spacecode.obed.pro prod-it.obed.pro;

    ssl_certificate /etc/letsencrypt/live/meetrec-obed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetrec-obed/privkey.pem;

    client_max_body_size 300m;

    location / {
        proxy_pass http://host.docker.internal:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
