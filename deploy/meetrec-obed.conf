# Meetrec: bp.obed.pro, spacecode.obed.pro, prod-it.obed.pro
# Встраивается в nginx прокси (smart_ski). Upstream: host.docker.internal:MEETREC_PORT (18000 на shared-сервере)

# HTTP — acme-challenge для certbot, остальное — редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bp.obed.pro spacecode.obed.pro prod-it.obed.pro;

    client_max_body_size 300m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

