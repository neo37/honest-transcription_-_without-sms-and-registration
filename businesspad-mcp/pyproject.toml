[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "businesspad-mcp"
version = "0.1.0"
description = "MCP server for BusinessPad — OCR and org management tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
businesspad-mcp = "businesspad_mcp.server:main"

[project.urls]
Homepage = "https://baza.business-pad.com"

[tool.hatch.build.targets.wheel]
packages = ["businesspad_mcp"]
