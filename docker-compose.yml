services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    image: meetrec_ocr
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - OCR_SERVER=${OCR_SERVER:-}
      - OCR_MODEL=${OCR_MODEL:-allenai/olmOCR-2-7B-1025-FP8}
      - OCR_API_KEY=${OCR_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meetrec
      POSTGRES_PASSWORD: meetrec
      POSTGRES_DB: meetrec
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U meetrec -d meetrec" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "18000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://meetrec:meetrec@db:5432/meetrec
      - MEDIA_ROOT=/app/data/media
      - DEBUG=True
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    volumes:
      - app_data:/app/data
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             (python manage.py createsuperuser --noinput 2>/dev/null || true) &&
             (python manage.py register_tg_webhook 2>&1 || true) &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 600 meetrec.wsgi:application"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/login/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      ocr:
        condition: service_healthy
      db:
        condition: service_healthy

  poller:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgres://meetrec:meetrec@db:5432/meetrec
      - MEDIA_ROOT=/app/data/media
    volumes:
      - app_data:/app/data
    command: python manage.py run_poller
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  app_data:
  pgdata:
