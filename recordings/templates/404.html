<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Страница не найдена</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f2e;
            color: #e8eaf6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }
        .logo-wrap {
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 0.8s 0.3s forwards;
        }
        .error-code {
            font-size: clamp(6rem, 18vw, 14rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #A9DAE6 0%, #5bafd6 40%, #232856 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeUp 0.8s 0.5s forwards;
            letter-spacing: -4px;
            user-select: none;
        }
        .error-title {
            font-size: clamp(1rem, 3vw, 1.6rem);
            color: #A9DAE6;
            font-weight: 300;
            margin-top: 8px;
            letter-spacing: 0.1em;
            opacity: 0;
            animation: fadeUp 0.8s 0.7s forwards;
        }
        .error-desc {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #7890a8;
            margin-top: 16px;
            max-width: 360px;
            line-height: 1.7;
            opacity: 0;
            animation: fadeUp 0.8s 0.9s forwards;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 36px;
            padding: 12px 28px;
            background: rgba(169, 218, 230, 0.12);
            border: 1px solid rgba(169, 218, 230, 0.35);
            border-radius: 50px;
            color: #A9DAE6;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            pointer-events: all;
            opacity: 0;
            animation: fadeUp 0.8s 1.1s forwards;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .back-btn:hover {
            background: rgba(169, 218, 230, 0.22);
            border-color: rgba(169, 218, 230, 0.6);
            transform: translateY(-2px);
        }
        .back-btn svg { width: 18px; height: 18px; fill: currentColor; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div id="canvas-container"></div>

<div class="content">
    <div class="logo-wrap" id="svg-logo">
        <!-- BP Logo placeholder – replaced by Three.js canvas -->
    </div>
    <div class="error-code">404</div>
    <div class="error-title">СТРАНИЦА НЕ НАЙДЕНА</div>
    <p class="error-desc">Кажется, эта страница улетела в другое измерение.<br>Попробуйте вернуться на главную.</p>
    <a href="/" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
        На главную
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(function () {
    'use strict';

    // ── Scene setup ───────────────────────────────────────────────────────────
    const W = window.innerWidth, H = window.innerHeight;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(0x0a0f2e, 1);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 200);
    camera.position.set(0, 0, 14);

    // ── Lights ────────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    const dirLight = new THREE.DirectionalLight(0xA9DAE6, 1.5);
    dirLight.position.set(5, 10, 8);
    scene.add(dirLight);

    const pLight1 = new THREE.PointLight(0x5bafd6, 2.5, 40);
    pLight1.position.set(-6, 4, 6);
    scene.add(pLight1);

    const pLight2 = new THREE.PointLight(0x232856, 2, 30);
    pLight2.position.set(6, -4, -4);
    scene.add(pLight2);

    // ── Materials ─────────────────────────────────────────────────────────────
    const matLogo = new THREE.MeshStandardMaterial({
        color: 0x232856,
        roughness: 0.25,
        metalness: 0.7,
        envMapIntensity: 1,
    });
    const matRing = new THREE.MeshStandardMaterial({
        color: 0xA9DAE6,
        roughness: 0.2,
        metalness: 0.8,
        transparent: true,
        opacity: 0.9,
    });
    const matOrb = new THREE.MeshStandardMaterial({
        color: 0x5bafd6,
        roughness: 0.3,
        metalness: 0.6,
        transparent: true,
        opacity: 0.75,
        wireframe: false,
    });
    const matWire = new THREE.MeshStandardMaterial({
        color: 0xA9DAE6,
        roughness: 0.5,
        metalness: 0.3,
        wireframe: true,
        transparent: true,
        opacity: 0.3,
    });

    // ── BP Logo 3D (stylised "BP" initials as extruded box letters) ───────────
    const logoGroup = new THREE.Group();

    function makeBox(w, h, d, x, y, mat) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, 0);
        return m;
    }

    // Letter "B"
    const bGroup = new THREE.Group();
    bGroup.add(makeBox(0.25, 2.2, 0.4, 0, 0, matLogo));      // vertical stem
    bGroup.add(makeBox(0.7, 0.25, 0.4, 0.375, 0.85, matLogo));  // top bar
    bGroup.add(makeBox(0.7, 0.25, 0.4, 0.375, 0.0,  matLogo));  // mid bar
    bGroup.add(makeBox(0.7, 0.25, 0.4, 0.375, -0.85, matLogo)); // bottom bar
    bGroup.add(makeBox(0.25, 0.85, 0.4, 0.725, 0.43, matRing)); // upper bump
    bGroup.add(makeBox(0.25, 0.85, 0.4, 0.725, -0.43, matRing)); // lower bump
    bGroup.position.x = -1.4;
    logoGroup.add(bGroup);

    // Letter "P"
    const pGroup = new THREE.Group();
    pGroup.add(makeBox(0.25, 2.2, 0.4, 0, 0, matLogo));       // vertical stem
    pGroup.add(makeBox(0.7, 0.25, 0.4, 0.375, 0.85, matLogo)); // top bar
    pGroup.add(makeBox(0.7, 0.25, 0.4, 0.375, 0.0,  matLogo)); // mid bar
    pGroup.add(makeBox(0.25, 0.85, 0.4, 0.725, 0.43, matRing)); // bump
    pGroup.position.x = 0.4;
    logoGroup.add(pGroup);

    logoGroup.position.y = 3.5;
    logoGroup.scale.setScalar(1.1);
    scene.add(logoGroup);

    // ── Central orb (sphere behind logo) ─────────────────────────────────────
    const orbGeo = new THREE.SphereGeometry(2.2, 64, 64);
    const orb = new THREE.Mesh(orbGeo, matOrb);
    orb.position.y = 3.5;
    scene.add(orb);

    // ── Torus rings ───────────────────────────────────────────────────────────
    const rings = [];
    const ringParams = [
        { r: 3.4, tube: 0.04, rx: Math.PI / 2, ry: 0 },
        { r: 4.0, tube: 0.03, rx: Math.PI / 3, ry: Math.PI / 6 },
        { r: 3.1, tube: 0.035, rx: -Math.PI / 4, ry: Math.PI / 3 },
    ];
    ringParams.forEach(p => {
        const torus = new THREE.Mesh(new THREE.TorusGeometry(p.r, p.tube, 8, 120), matRing.clone());
        torus.rotation.set(p.rx, p.ry, 0);
        torus.position.y = 3.5;
        scene.add(torus);
        rings.push(torus);
    });

    // ── Floating geometric shapes ─────────────────────────────────────────────
    const floaters = [];
    const geos = [
        new THREE.IcosahedronGeometry(0.45, 0),
        new THREE.OctahedronGeometry(0.55, 0),
        new THREE.TetrahedronGeometry(0.5, 0),
        new THREE.BoxGeometry(0.6, 0.6, 0.6),
        new THREE.IcosahedronGeometry(0.3, 0),
        new THREE.OctahedronGeometry(0.4, 0),
        new THREE.TetrahedronGeometry(0.35, 0),
        new THREE.BoxGeometry(0.4, 0.4, 0.4),
        new THREE.IcosahedronGeometry(0.25, 0),
        new THREE.OctahedronGeometry(0.3, 0),
        new THREE.IcosahedronGeometry(0.5, 0),
        new THREE.TetrahedronGeometry(0.45, 0),
    ];
    const mats = [matWire, matRing.clone(), matOrb.clone()];
    mats[1].opacity = 0.55; mats[1].transparent = true;
    mats[2].opacity = 0.45; mats[2].transparent = true;

    geos.forEach((geo, i) => {
        const mat = mats[i % mats.length];
        const mesh = new THREE.Mesh(geo, mat);
        const angle = (i / geos.length) * Math.PI * 2;
        const radius = 5 + Math.random() * 3.5;
        mesh.position.set(
            Math.cos(angle) * radius,
            (Math.random() - 0.5) * 10,
            Math.sin(angle) * radius * 0.5 - 2
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        mesh._speed = { rx: (Math.random() - 0.5) * 0.012, ry: (Math.random() - 0.5) * 0.015 };
        mesh._floatOffset = Math.random() * Math.PI * 2;
        mesh._floatAmp = 0.3 + Math.random() * 0.4;
        mesh._baseY = mesh.position.y;
        floaters.push(mesh);
        scene.add(mesh);
    });

    // ── Star field ────────────────────────────────────────────────────────────
    const starCount = 800;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3]     = (Math.random() - 0.5) * 120;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 80 - 20;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xA9DAE6, size: 0.08, transparent: true, opacity: 0.7 });
    scene.add(new THREE.Points(starGeo, starMat));

    // ── Mouse parallax ────────────────────────────────────────────────────────
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
    });

    // ── Animation loop ────────────────────────────────────────────────────────
    let t = 0;
    function animate() {
        requestAnimationFrame(animate);
        t += 0.016;

        // Logo slow rotate
        logoGroup.rotation.y = Math.sin(t * 0.3) * 0.25 + mouseX * 0.15;
        logoGroup.rotation.x = Math.sin(t * 0.2) * 0.12 + mouseY * 0.1;
        orb.rotation.y = t * 0.15;

        // Rings
        rings.forEach((r, i) => {
            r.rotation.z = t * (0.12 + i * 0.05);
            r.rotation.x += 0.003 + i * 0.002;
        });

        // Floaters
        floaters.forEach((f, i) => {
            f.rotation.x += f._speed.rx;
            f.rotation.y += f._speed.ry;
            f.position.y = f._baseY + Math.sin(t * 0.7 + f._floatOffset) * f._floatAmp;
        });

        // Camera parallax
        camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.04;
        camera.position.y += (mouseY * 1.0 - camera.position.y) * 0.04;
        camera.lookAt(0, 1.5, 0);

        renderer.render(scene, camera);
    }
    animate();

    // ── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
})();
</script>
</body>
</html>
