<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Вход в пространство — MeetRec</title>
    {% load static %}
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .p-wrap {
            width: 100%;
            max-width: 420px;
        }

        .p-tag {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: #fff;
            margin-bottom: 0.4rem;
        }

        .sub {
            font-size: 0.82rem;
            color: #555;
            margin-bottom: 2rem;
            font-family: system-ui, sans-serif;
        }

        label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 0.4rem;
            margin-top: 1.1rem;
        }
        label:first-of-type { margin-top: 0; }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: #111;
            border: 2px solid #2a2a2a;
            color: #e8e8e8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
            border-radius: 0;
            -webkit-appearance: none;
        }
        input:focus { border-color: #e8e8e8; }
        input::placeholder { color: #333; }

        .btn-submit {
            margin-top: 1.75rem;
            width: 100%;
            padding: 0.85rem;
            background: #e8e8e8;
            border: 2px solid #e8e8e8;
            color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-submit:hover { background: #0a0a0a; color: #e8e8e8; }

        .error {
            font-size: 0.82rem;
            color: #ff4444;
            border-left: 2px solid #ff4444;
            padding-left: 0.75rem;
            margin-bottom: 1.25rem;
            font-family: system-ui, sans-serif;
        }

        .back-link {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #333;
            font-family: system-ui, sans-serif;
        }
        .back-link a { color: #666; }
        .back-link a:hover { color: #aaa; }

        .hint {
            font-size: 0.75rem;
            color: #444;
            margin-top: 0.35rem;
            font-family: system-ui, sans-serif;
        }

        @media (max-width: 480px) {
            body { padding: 1.5rem 1rem; align-items: flex-start; padding-top: 2rem; }
        }
    </style>
</head>
<body>
<div class="p-wrap">
    <p class="p-tag">D.O.O. SpaceCode / MeetRec</p>
    <h1>Вход</h1>
    <p class="sub">Используйте email и пароль, выданный администратором</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" action="{% url 'recordings:pilot_login' %}{% if next_url %}?next={{ next_url }}{% endif %}">
        {% csrf_token %}

        <label for="id_email">Email</label>
        <input id="id_email" type="email" name="email" required autofocus
               placeholder="you@yourcompany.com" autocomplete="username">

        <label for="id_password">Пароль</label>
        <input id="id_password" type="password" name="password" required
               autocomplete="current-password" placeholder="••••••••">
        <p class="hint">Пароль был показан при регистрации пространства</p>

        <button type="submit" class="btn-submit">Войти →</button>
    </form>

    <p style="margin-top:1rem;font-size:0.82rem;color:var(--muted,#888);text-align:center;">
        Нет аккаунта? <a href="{% url 'recordings:org_register' %}" style="color:var(--accent,#5b6af0);font-weight:600;">Зарегистрировать организацию</a>
    </p>

    <p class="back-link" style="margin-top:1.25rem;">
        <a href="{% url 'recordings:login' %}">← Сотрудник BusinessPad? Войти здесь</a>
    </p>
</div>
<script>
(function() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('{% url "recordings:service_worker" %}', { scope: '/' }).catch(function() {});
    }
})();
</script>
</body>
</html>
